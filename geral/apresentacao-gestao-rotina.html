  return `<span style="color:${col};font-size:15px;font-weight:700">${ar} ${up?'+':''}${d.delta} pp</span>`;}
function escalaSlide(){let body;
  if(esp==="Todas"){body=`<div class="mini">`+D.ORDEM.map(e=>{const p=D.ESC[e].horas[2];const d=(D.ESC_DELTA||{})[e]||{};const neg=(d.delta!=null&&d.delta<=-0.15);
    return `<div class="m" style="${neg?'border:2px solid #C62828;box-shadow:0 3px 12px rgba(198,40,40,.20)':''}"><div class="n" style="color:${D.CORES[e]}">${e}</div><div class="p" style="color:${fc(p)}">${Math.round(p*100)}%</div><div style="margin-top:5px">${deltaBadge(e)}</div>${neg?'<div style="font-size:11px;color:#C62828;font-weight:700;margin-top:3px">⚠ atenção</div>':'<div class="gm" style="margin-top:3px">vs. semana anterior</div>'}</div>`;}).join("")+`</div>`;}
  else{const d=D.ESC[esp];body=`<div class="gauges">${gauge("Horas",d.horas[0],d.horas[1],d.horas[2])}${gauge("Atendimentos",d.atend[0],d.atend[1],d.atend[2])}</div><div style="margin-top:16px;font-size:17px;color:#2a3b4d">Variação de horas vs. semana anterior: ${deltaBadge(esp)}</div>`;}
  return `<div class="kick" style="color:#2E75B6"><span class="num" style="background:#2E75B6">1</span><span class="cad">↻ Toda semana</span></div><h1 class="big">Escala — atingimento de ${MESLBL}</h1>${body}<div class="rod">Meta × realizado · variação vs. semana anterior · gaps críticos de agenda.</div>`;}
function trendSlide(){const W=900,H=380,PL=54,PR=150,PT=20,PB=44,iw=W-PL-PR,ih=H-PT-PB,F=D.FASES;
  const X=i=>PL+iw*(i/(F.length-1)),Y=p=>PT+ih*(1-(p-0.4)/(1.05-0.4));let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px">`;
  [0.5,0.7,0.9,1.0].forEach(g=>{const y=Y(g);s+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#DDD"/><text x="${PL-10}" y="${y+5}" text-anchor="end" font-size="15" fill="#888">${g*100}%</text>`;});
  F.forEach((f,i)=>s+=`<text x="${X(i)}" y="${H-12}" text-anchor="middle" font-size="15" fill="#555">${f}</text>`);
  D.ORDEM.forEach(e=>{const pts=D.TREND[e],c=D.CORES[e],hl=(esp==="Todas"||esp===e),col=hl?c:"#DDD";const seg=[];pts.forEach((p,i)=>{if(p!=null)seg.push([X(i),Y(p),p])});if(!seg.length)return;
    s+=`<path d="M${seg.map(a=>a[0]+","+a[1]).join(" L")}" fill="none" stroke="${col}" stroke-width="${hl?3.4:1.6}"/>`;seg.forEach(a=>s+=`<circle cx="${a[0]}" cy="${a[1]}" r="${hl?4.2:2.4}" fill="${col}"/>`);
    if(hl){const l=seg[seg.length-1];s+=`<text x="${l[0]+8}" y="${l[1]+5}" font-size="15" font-weight="700" fill="${c}">${e} ${Math.round(l[2]*100)}%</text>`;}});s+="</svg>";
  return `<div class="kick" style="color:#2E75B6"><span class="num" style="background:#2E75B6">1</span><span class="cad">Tendência</span></div><h1 class="big">Evolução do atingimento de horas</h1>${s}<div class="rod">Comparar cada especialidade com sua meta e sua tendência.</div>`;}
function treinaSlide(){const SP=D.STATUS_PROTOCOLOS||{};let rows=[];
  if(esp==="Todas"){D.ORDEM.forEach(e=>(SP[e]||[]).forEach(x=>rows.push([e,x])));}
  else{(SP[esp]||[]).forEach(x=>rows.push([esp,x]));}
  let body;
  if(!rows.length){body=`<div class="ctx">Sem status de protocolo informado para ${esp} nesta semana.</div>`;}
  else{const head=esp==="Todas"?`<th>Especialidade</th><th>Protocolo</th><th>Status</th><th>Ação da semana</th>`:`<th>Protocolo</th><th>Status</th><th>Ação da semana</th>`;
    body=`<table class="ctable"><tr>${head}</tr>`+rows.map(([e,x])=>{const acao=x.star?`<span style="background:#FFE9B0;color:#9A6700;padding:3px 11px;border-radius:12px;font-weight:700;white-space:nowrap">⭐ ${x.acao}</span>`:x.acao;return `<tr>${esp==="Todas"?`<td style="color:${D.CORES[e]};font-weight:700">${e}</td>`:''}<td><b>${x.prot}</b></td><td>${x.status}</td><td>${acao}</td></tr>`;}).join("")+`</table>`;}
  return `<div class="kick" style="color:#7030A0"><span class="num" style="background:#7030A0">3</span><span class="cad">Status · ${MESLBL}</span></div><h1 class="big">Status dos protocolos</h1>${body}<div class="rod">Fonte: comunicação por e-mail aos coordenadores. ⭐ = iniciar treinamento nesta semana.</div>`;}
function treinbSlide(){const PX=D.PROXIMOS||{};let body;
  if(esp==="Todas"){body=`<table class="ctable"><tr><th>Especialidade</th><th>Próximo treinamento</th></tr>`+D.ORDEM.map(e=>`<tr><td style="color:${D.CORES[e]};font-weight:700">${e}</td><td><b>${PX[e]||'—'}</b></td></tr>`).join("")+`</table>`;}
  else{body=`<div class="ctx" style="font-size:24px"><b>${PX[esp]||'—'}</b></div>`;}
  return `<div class="kick" style="color:#7030A0"><span class="num" style="background:#7030A0">3</span><span class="cad">Próximos</span></div><h1 class="big">Treinamentos — próximos</h1>${body}<div class="rod">Próximo treinamento previsto por especialidade.</div>`;}
function protocolosSlide(){const url=D.ROADMAP_URL||"";return `<div class="kick" style="color:#548235"><span class="num" style="background:#548235">2</span><span class="cad">↻ Toda semana</span></div><h1 class="big">Protocolos</h1><div style="font-size:25px;color:#548235;font-weight:700;margin-bottom:20px">Roadmap da esteira de aprovação</div><a href="${url}" target="_blank" style="font-size:20px;color:#1F4E79;word-break:break-all">${url}</a><div class="rod">Etapas e prazos do fluxo de aprovação dos protocolos.</div>`;}
function capaSlide(){return `<div class="cover" style="display:flex;position:absolute;inset:0;flex-direction:column;justify-content:center;padding:6vh 8vw">${D.LOGO?`<img src="${D.LOGO}" alt="Arpen" style="height:74px;border-radius:8px;margin-bottom:26px;align-self:flex-start">`:''}<h1>Reunião de Gestão da Rotina</h1><div class="s">Hospital São Cristóvão · Coordenação Médica · Arpen</div><div style="margin:6px 0 26px;display:flex;gap:12px;flex-wrap:wrap"><span style="font-size:21px;font-weight:700;background:rgba(255,255,255,.16);padding:9px 20px;border-radius:12px">🗓️ Mês em discussão: ${MESLBL}</span>${D.SEMANA?`<span style="font-size:21px;font-weight:700;background:rgba(255,255,255,.28);padding:9px 20px;border-radius:12px">📅 ${D.SEMANA}</span>`:''}</div><div class="lbl">Escolha a especialidade da reunião</div><div class="espbtns" id="espbtns"></div><div class="hint">Setas ◀ ▶ do teclado (ou os botões) para conduzir · tecla F = tela cheia.</div></div>`;}
function fimSlide(){return `<div class="kick" style="color:#1F4E79"><span class="num" style="background:#1F4E79">✓</span></div><h1 class="big">Encerramento</h1>`;}
function compromissosSlide(){return `<div class="kick" style="color:#1F4E79"><span class="num" style="background:#1F4E79">6</span><span class="cad">↻ Toda semana</span></div>
  <h1 class="big">Compromissos da semana <span style="font-size:20px;color:#667;font-weight:600">— ${esp}</span></h1>
  <table class="ctable" id="cmpTable"><tr><th style="width:42%">Ação (o quê)</th><th>Responsável</th><th>Prazo</th><th>Status</th></tr>
  ${[0,1,2].map(i=>`<tr>
    <td><input class="cin" data-i="${i}" data-k="acao" placeholder="O que será feito"></td>
    <td><input class="cin" data-i="${i}" data-k="resp" placeholder="Quem"></td>
    <td><input class="cin" data-i="${i}" data-k="prazo" placeholder="Até quando"></td>
    <td><input class="cin" data-i="${i}" data-k="status" value="Em aberto"></td>
  </tr>`).join("")}
  </table>
  <div style="margin-top:16px;display:flex;gap:12px;align-items:center">
    <button class="tb" style="background:#1F4E79;color:#fff;padding:11px 20px;font-size:15px" onclick="cmpCopy()">📋 Copiar p/ Plano de Ação</button>
    <button class="tb" style="padding:11px 20px;font-size:15px" onclick="cmpCsv()">⬇ Baixar .csv</button>
    <span id="cmpMsg" style="font-weight:700"></span>
  </div>
  <div class="rod">Máximo 3 compromissos. Salvo automaticamente neste navegador. Exporte para registrar no Plano de Ação de ${esp}.</div>`;}
function renderSlide(k){if(k==="capa")return capaSlide();if(k==="escala")return escalaSlide();if(k==="trend")return trendSlide();if(k==="protocolos")return protocolosSlide();if(k==="treina")return treinaSlide();if(k==="treinb")return treinbSlide();if(k==="compromissos")return compromissosSlide();if(k==="fim")return fimSlide();if(k[0]==="b")return blockSlide(k.slice(1));return "";}
function cmpKey(){return "cmp_"+esp+"_"+(D.SEMANA||"S").replace(/\s+/g,"");}
function cmpData(){const rows=[];document.querySelectorAll('#cmpTable input').forEach(inp=>{const i=+inp.dataset.i;rows[i]=rows[i]||{};rows[i][inp.dataset.k]=inp.value;});return rows;}
function cmpSave(){try{localStorage.setItem(cmpKey(),JSON.stringify(cmpData()));}catch(e){}}
function bindCompromissos(){let saved=[];try{saved=JSON.parse(localStorage.getItem(cmpKey())||"[]");}catch(e){}
  document.querySelectorAll('#cmpTable input').forEach(inp=>{const i=+inp.dataset.i,k=inp.dataset.k;if(saved[i]&&saved[i][k]!=null&&saved[i][k]!=="")inp.value=saved[i][k];inp.addEventListener('input',cmpSave);});}
function cmpRows(){const out=[];cmpData().forEach(r=>{if(r&&(r.acao||"").trim())out.push([(D.SEMANA||""),esp,r.acao||"",r.resp||"",r.prazo||"",r.status||"Em aberto",""]);});return out;}
function cmpMsg(t,c){const m=document.getElementById('cmpMsg');if(m){m.textContent=t;m.style.color=c;}}
function cmpCopy(){const rows=cmpRows();if(!rows.length){cmpMsg('Preencha ao menos uma ação','#C62828');return;}
  const tsv=rows.map(r=>r.join('\t')).join('\n');navigator.clipboard.writeText(tsv).then(()=>cmpMsg('Copiado! Cole no Plano de Ação','#2E7D32'),()=>cmpMsg('Não foi possível copiar','#C62828'));}
function cmpCsv(){const rows=cmpRows();if(!rows.length){cmpMsg('Preencha ao menos uma ação','#C62828');return;}
  const head=['Data da reunião','Especialidade','Compromisso/Ação','Responsável','Prazo','Status','Observações'];
  const csv=[head,...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob(["﻿"+csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download="Plano_de_Acao_"+esp+"_"+(D.SEMANA||"").replace(/\s+/g,"")+".csv";a.click();URL.revokeObjectURL(url);cmpMsg('CSV baixado','#2E7D32');}
function build(){const deck=document.getElementById("deck");deck.innerHTML=SLIDES.map((k,i)=>`<section class="slide${i===cur?' active':''}" data-i="${i}">${k==="capa"?renderSlide(k):`<div style="width:100%">${renderSlide(k)}</div>`}</section>`).join("");if(SLIDES[cur]==="capa")bindCapa();if(SLIDES[cur]==="compromissos")bindCompromissos();updateChrome();}
function bindCapa(){const box=document.getElementById("espbtns");if(!box)return;box.innerHTML=["Todas",...D.ORDEM].map(e=>{const c=D.CORES[e];const on=e===esp;const st=e==="Todas"?(on?"background:#fff;color:#12314b":""):`border-color:${c};${on?`background:${c};color:#fff`:`color:#fff`}`;return `<button class="espb${on?' on':''}" style="${st}" onclick="pick('${e}')">${e}</button>`;}).join("");}
function pick(e){esp=e;build();}
function cycleEsp(){const arr=["Todas",...D.ORDEM];esp=arr[(arr.indexOf(esp)+1)%arr.length];build();}
function show(i){document.querySelectorAll('.slide').forEach(s=>s.classList.toggle('active',+s.dataset.i===i));cur=i;if(SLIDES[cur]==="capa")bindCapa();if(SLIDES[cur]==="compromissos")bindCompromissos();updateChrome();}
function go(d){let n=cur+d;if(n<0)n=0;if(n>=SLIDES.length)n=SLIDES.length-1;show(n);}
function updateChrome(){document.getElementById("counter").textContent=`${cur+1} / ${SLIDES.length}`;document.getElementById("dots").style.width=((cur+1)/SLIDES.length*100)+"%";document.getElementById("espNow").textContent="🎯 "+esp;document.getElementById("topbar").style.display=SLIDES[cur]==="capa"?"none":"flex";}
function fs(){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();}
document.addEventListener("keydown",e=>{if(["ArrowRight"," ","PageDown"].includes(e.key)){go(1);e.preventDefault();}else if(["ArrowLeft","PageUp"].includes(e.key)){go(-1);e.preventDefault();}else if(e.key==="f"||e.key==="F"){fs();}});
build();
</script></body></html>
